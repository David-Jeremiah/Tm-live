<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TM Live — Sound & Lighting{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #F5C518;
      --gold-dark: #c9a000;
      --gold-light: #ffe066;
      --black: #0a0a0a;
      --dark: #111111;
      --dark2: #1a1a1a;
      --dark3: #222222;
      --grey: #888;
      --white: #fff;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(245,197,24,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0 24px;
    }
    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 1px;
    }
    .nav-logo span { color: var(--white); }
    .nav-links {
      display: flex;
      gap: 8px;
      list-style: none;
    }
    .nav-links a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--gold);
      background: rgba(245,197,24,0.1);
    }
    .nav-cta {
      background: var(--gold) !important;
      color: var(--black) !important;
      font-weight: 700 !important;
    }
    .nav-cta:hover { background: var(--gold-light) !important; }

    /* MAIN */
    main { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-gold {
      background: var(--gold);
      color: var(--black);
    }
    .btn-gold:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-outline {
      background: transparent;
      color: var(--gold);
      border: 1.5px solid var(--gold);
    }
    .btn-outline:hover { background: rgba(245,197,24,0.1); }
    .btn-dark {
      background: var(--dark3);
      color: var(--white);
    }
    .btn-dark:hover { background: #2a2a2a; }

    /* CARDS */
    .card {
      background: var(--dark2);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius);
      padding: 28px;
      transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover {
      border-color: rgba(245,197,24,0.3);
      transform: translateY(-2px);
    }

    /* GOLD TEXT */
    .gold { color: var(--gold); }

    /* SECTION HEADING */
    .section-heading {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--white);
      margin-bottom: 8px;
    }
    .section-heading .accent { color: var(--gold); }
    .section-sub {
      color: var(--grey);
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    /* BADGES */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-sound { background: rgba(245,197,24,0.15); color: var(--gold); border: 1px solid rgba(245,197,24,0.3); }
    .badge-lighting { background: rgba(180,130,255,0.15); color: #c084fc; border: 1px solid rgba(180,130,255,0.3); }

    /* PRICE TAG */
    .price-tag {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold);
    }
    .price-tag small {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--grey);
      display: block;
    }

    /* INCLUDES LIST */
    .includes-list {
      list-style: none;
      margin: 12px 0;
    }
    .includes-list li {
      padding: 5px 0;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.8);
      padding-left: 20px;
      position: relative;
    }
    .includes-list li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: var(--gold);
      font-weight: 700;
    }

    /* FORM */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 7px;
      letter-spacing: 0.3px;
    }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      background: var(--dark3);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 9px;
      color: var(--white);
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      transition: border-color 0.2s;
      outline: none;
    }
    .form-control:focus { border-color: var(--gold); }
    .form-control option { background: var(--dark2); }
    textarea.form-control { resize: vertical; min-height: 100px; }

    /* GRID */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    @media (max-width: 768px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      main { padding: 24px 16px 60px; }
    }

    /* DIVIDER */
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin: 40px 0;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 24px;
      text-align: center;
      color: var(--grey);
      font-size: 0.8rem;
    }
    footer a { color: var(--gold); text-decoration: none; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="{% url 'catalogue:home' %}" class="nav-logo">TM <span>Live</span></a>
      <ul class="nav-links">
        <li><a href="{% url 'catalogue:catalogue' %}">Catalogue</a></li>
        <li><a href="{% url 'catalogue:budget_calculator' %}">Budget Calculator</a></li>
        <li><a href="{% url 'catalogue:request_quote' %}" class="nav-cta">Get Quote</a></li>
      </ul>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>© 2025 TM Live — Professional Sound &amp; Lighting | Uganda</p>
    <p style="margin-top:6px;">
      <a href="https://wa.me/256777523280">📞 WhatsApp</a> &nbsp;|&nbsp;
      <a href="https://tmliveug.netlify.app/">🌐 Website</a>
    </p>
  </footer>
</body>
</html>
